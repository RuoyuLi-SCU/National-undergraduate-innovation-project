short_bio_text_justify: false
short_bio: >-
  <p>
    I am Zijun Guan from West China School of Medicine, Sichuan University. I am working with Jin Longtang, a teacher from the School of Computer Science, to guide Ruoyu Li's national innovation program. My research interests include: the application of artificial intelligence in the field of health care, cognitive science and neural networks, neuroelectroencephalography, etc.
  </p>
  <p>
    During my academic career, I have participated in many projects and accumulated rich practical experience. I am keen to explore new technologies and share my research results in academic conferences and journals. I look forward to communicating and collaborating with researchers from different backgrounds to jointly promote academic progress.
  </p>

